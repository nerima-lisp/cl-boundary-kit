# cl-boundary-kit documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve  -f docs/mkdocs.yml
# The Nix flake (`nix build .#docs`) drives the same config offline.

site_name: cl-boundary-kit
site_description: >-
  Boundary-oriented testing utilities for Common Lisp — explicit protocols,
  recording wrappers, and deterministic test doubles for every external
  effect an application touches.
site_author: cl-boundary-kit contributors
site_url: https://nerima-lisp.github.io/cl-boundary-kit/

repo_name: nerima-lisp/cl-boundary-kit
repo_url: https://github.com/nerima-lisp/cl-boundary-kit
edit_uri: edit/main/docs/src/

# Content lives in docs/src, matching the cl-weave documentation layout.
docs_dir: src
site_dir: ../site
use_directory_urls: true

copyright: Copyright &copy; cl-boundary-kit contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/border-all-variant
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-boundary-kit
      name: cl-boundary-kit on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs (e.g. install-path or boundary-variant switchers).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols, emoji.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - Home: README.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
      - Core Concepts: core-concepts.md
  - Guide:
      - Composition and Context: composition.md
      - Filesystem and Environment: filesystem-and-environment.md
      - Time and Randomness: time-and-randomness.md
      - Process, Network, and DNS: process-network-and-dns.md
      - Logging, Metrics, and Console: observability.md
      - State and Storage: state-and-storage.md
      - Concurrency Control: concurrency-control.md
      - Messaging: messaging.md
      - System and Host: system-and-host.md
      - Assertions and Testing Helpers: testing-helpers.md
  - Examples: examples.md
  - Reference:
      - Architecture: architecture.md
      - Repository Layout: repository-layout.md
      - Running the Test Suite: testing.md
      - Compatibility: compatibility.md
      - Stability Policy: stability-policy.md
      - Design Non-Goals: design-notes.md
  - Governance:
      - Governance: governance.md
      - Code of Conduct: code-of-conduct.md
      - Support: support.md
      - Security: security.md
      - Roadmap: roadmap.md
      - Release Process: release-process.md
  - Contributing:
      - Contributing: contributing.md
      - Cookbook: cookbook.md
      - FAQ: faq.md
