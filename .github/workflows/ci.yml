name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17

      - name: Configure Cachix
        if: ${{ vars.CACHIX_CACHE != '' }}
        uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build test artifacts
        run: |
          nix build ".#checks.x86_64-linux.machine-report" --out-link result-report
          nix build ".#checks.x86_64-linux.coverage" --out-link result-coverage
          mkdir -p artifacts/report artifacts/coverage
          cp -R result-report/. artifacts/report/
          cp -R result-coverage/. artifacts/coverage/

      - name: Upload test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cl-boundary-kit-x86_64-linux
          path: artifacts
          if-no-files-found: warn
